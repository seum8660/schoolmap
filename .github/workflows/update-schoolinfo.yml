name: 학교알리미 자료 갱신

on:
  workflow_dispatch:          # Actions 탭에서 [Run workflow]로 수동 실행
  schedule:
    - cron: "0 18 * * 0"      # 매주 월요일 03:00(한국시간) 자동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 학교알리미 자료 수집
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          SI_API_TYPES: ${{ vars.SI_API_TYPES }}
          SI_SIDO: ${{ vars.SI_SIDO }}
        run: python scripts/fetch_schoolinfo.py
      - name: 변경분 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "학교알리미 자료 자동 갱신"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push && exit 0
            echo "재시도 $i"; git rebase --abort 2>/dev/null || true; sleep 5
          done
          exit 1
