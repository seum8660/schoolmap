name: 학교알리미 자료 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 학교알리미 자료 수집
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          SI_SIDO: ${{ vars.SI_SIDO }}
        run: python scripts/fetch_schoolinfo.py
      - name: 변경분 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "학교알리미 자료 자동 갱신"
          git push
