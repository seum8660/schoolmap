name: 건축물대장 자료 갱신

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용 학교 수(비우면 전체)"
        required: false
        default: ""
  schedule:
    - cron: "0 19 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 건축물대장 수집
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          BLDG_KEY: ${{ secrets.BLDG_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python scripts/fetch_buildings.py
      - name: 변경분 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull --rebase || true
          git add data/buildings.json
          git diff --cached --quiet || git commit -m "건축물대장 자료 자동 갱신"
          git push
