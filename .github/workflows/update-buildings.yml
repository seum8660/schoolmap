name: 건축물대장 자료 갱신

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용 학교 수(비우면 전체)"
        required: false
        default: ""
  schedule:
    - cron: "0 19 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 건축물대장 수집
        env:
          BLDG_KEY: ${{ secrets.BLDG_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python scripts/fetch_buildings.py
      - name: 변경분 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "건축물대장 자료 자동 갱신"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push && exit 0
            echo "재시도 $i"; git rebase --abort 2>/dev/null || true; sleep 5
          done
          exit 1
